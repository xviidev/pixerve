[package]
name = "pixerve"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rs-vips = "0.7"
mime_guess = "2"
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.12", features = ["aws"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync", "time", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

